name: Ingest jobs

on:
  schedule:
    # 09:30 UTC daily. Off the hour, because scheduled runs cluster on the hour and get queued.
    - cron: '30 9 * * *'
  workflow_dispatch:
    inputs:
      limit_companies:
        description: 'Only fetch the first N companies (leave empty for all)'
        required: false
      reparse:
        description: 'Re-parse unchanged jobs too (after parser or skills.json changes)'
        type: boolean
        default: false

concurrency:
  group: ingest
  cancel-in-progress: false # never run two ingestions against the same database

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run ingestion
        env:
          # DATABASE_URL must be the Supabase *session pooler* string (IPv4): the direct one
          # isn't reachable from GitHub runners.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
        run: |
          python -m app.ingestion.run \
            ${{ inputs.limit_companies && format('--limit-companies {0}', inputs.limit_companies) || '' }} \
            ${{ inputs.reparse && '--reparse' || '' }}
